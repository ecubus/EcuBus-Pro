name: Build-macOS

on:
  push:
    branches: [master]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # Build job
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Embedding Python
        uses: ./.github/actions/setup-python-build
      - name: Build App
        uses: ./.github/actions/build-app
        with:
          platform: mac
          run-sdk-build: 'false'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          main_vite_client_id: ${{ secrets.CLIENT_ID }}
          main_vite_client_secret: ${{ secrets.CLIENT_SECRET }}
      - name: Load packaged Toomoss CAN SDK on Apple Silicon
        shell: bash
        run: |
          app="dist/mac-arm64/EcuBus-Pro.app/Contents"
          addon=("$app"/Resources/app.asar.unpacked/out/main/chunks/toomoss-*.node)
          ELECTRON_RUN_AS_NODE=1 "$app/MacOS/EcuBus-Pro" -e '
            const assert = require("node:assert/strict")
            assert.equal(process.arch, "arm64")
            const sdk = require(require("node:path").resolve(process.argv[1]))
            for (const name of ["CAN_Init", "CAN_SendMsg", "CAN_GetMsgWithSize",
                                "CANFD_Init", "CANFD_SendMsg", "CANFD_GetMsg"]) {
              assert.equal(typeof sdk[name], "function", name)
            }
            assert.ok(sdk.USB_ScanDevice(new sdk.I32Array(256)) >= 0)
          ' "${addon[0]}"
      - uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: dist/*.dmg

